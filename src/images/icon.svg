<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#134E4A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="lensB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#16A34A"/>
      <stop offset="100%" stop-color="#14532D"/>
    </linearGradient>
  </defs>
  <!-- Rounded squircle base -->
  <rect x="6" y="6" width="116" height="116" rx="26" fill="url(#bgB)" stroke="#2DD4BF" stroke-width="4"/>
  <!-- Envelope + Header Card -->
  <rect x="18" y="22" width="74" height="68" rx="8" fill="#F8FAFC" stroke="#0F172A" stroke-width="3"/>
  <!-- Envelope Top Accent Bar / Flap -->
  <path d="M20 25 L55 47 L90 25" fill="none" stroke="#0D9488" stroke-width="5.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- SPF / DKIM / DMARC Header Lines -->
  <rect x="28" y="54" width="16" height="6" rx="3" fill="#16A34A"/>
  <rect x="48" y="54" width="34" height="6" rx="3" fill="#334155"/>
  <rect x="28" y="66" width="16" height="6" rx="3" fill="#16A34A"/>
  <rect x="48" y="66" width="28" height="6" rx="3" fill="#334155"/>
  <rect x="28" y="78" width="16" height="6" rx="3" fill="#0284C7"/>
  <rect x="48" y="78" width="22" height="6" rx="3" fill="#64748B"/>
  <!-- Magnifying Glass Handle -->
  <line x1="99" y1="99" x2="114" y2="114" stroke="#F59E0B" stroke-width="11" stroke-linecap="round"/>
  <line x1="99" y1="99" x2="114" y2="114" stroke="#FEF3C7" stroke-width="4" stroke-linecap="round"/>
  <!-- Magnifying Glass Ring & Verified Green Lens -->
  <circle cx="80" cy="80" r="25" fill="url(#lensB)" stroke="#FFFFFF" stroke-width="6"/>
  <circle cx="80" cy="80" r="22" fill="none" stroke="#F59E0B" stroke-width="3"/>
  <!-- Crisp Checkmark inside Loupe -->
  <path d="M69 80 L77 88 L93 71" fill="none" stroke="#FFFFFF" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
