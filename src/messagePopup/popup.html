<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>SpoofCheck</title>
    <link rel="stylesheet" type="text/css" media="screen" href="popup.css">
</head>
<body>
<div class="panel" id="panel">
    <h2 data-i18n="sectionClaim">Claim</h2>
    <div class="grid" id="claim"></div>

    <h2 data-i18n="sectionConfirm">Confirm</h2>
    <div id="confirm"></div>
    <div class="src" id="arnote"></div>

    <h2 data-i18n="sectionVerdict">Verdict</h2>
    <div id="verdict" class="verdict pending"><b data-i18n="checking">Checking…</b></div>

    <details id="path"><summary id="pathTitle"></summary><ol class="mono" id="hops"></ol></details>
    <div class="note" data-i18n="footnote"></div>
</div>
<script type="module" src="popup.js"></script>
</body>
</html>
